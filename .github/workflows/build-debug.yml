name: Build Debug APK

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REMOTEX_KEYSTORE_PASSWORD: ${{ secrets.REMOTEX_KEYSTORE_PASSWORD }}
      REMOTEX_KEY_ALIAS: ${{ secrets.REMOTEX_KEY_ALIAS }}
      REMOTEX_KEY_PASSWORD: ${{ secrets.REMOTEX_KEY_PASSWORD }}
      REMOTEX_VERSION_CODE: ${{ github.run_number }}
      REMOTEX_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate persistent signing secrets
        shell: bash
        env:
          REMOTEX_KEYSTORE_BASE64: ${{ secrets.REMOTEX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$REMOTEX_KEYSTORE_BASE64" ]] || { echo 'REMOTEX_KEYSTORE_BASE64 is missing'; exit 1; }
          [[ -n "$REMOTEX_KEYSTORE_PASSWORD" ]] || { echo 'REMOTEX_KEYSTORE_PASSWORD is missing'; exit 1; }
          [[ -n "$REMOTEX_KEY_ALIAS" ]] || { echo 'REMOTEX_KEY_ALIAS is missing'; exit 1; }
          [[ -n "$REMOTEX_KEY_PASSWORD" ]] || { echo 'REMOTEX_KEY_PASSWORD is missing'; exit 1; }

      - name: Decode persistent signing keystore
        shell: bash
        env:
          REMOTEX_KEYSTORE_BASE64: ${{ secrets.REMOTEX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/remotex-update.jks"
          printf '%s' "$REMOTEX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "REMOTEX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Check repository for secrets
        run: ./scripts/check-secrets.sh

      - name: Check Compose scoped imports
        run: bash ./scripts/tests/check-compose-scope-imports.sh

      - name: Check Kotlin compile regressions
        run: bash ./scripts/tests/check-compile-regressions.sh
      - name: Check app compile regressions
        run: bash ./scripts/tests/check-app-compile-regressions.sh
      - name: Check MINA Android runtime setup
        run: bash ./scripts/tests/check-mina-android-runtime.sh

      - name: Check SFTP IO dispatch
        run: bash ./scripts/tests/check-sftp-io-dispatch.sh

      - name: Check stable debug signing
        run: bash ./scripts/tests/check-stable-debug-signing.sh

      - name: Check VNC polish source
        run: bash ./scripts/tests/check-vnc-polish-source.sh

      - name: Check VNC input stability
        run: bash ./scripts/tests/check-vnc-input-stability.sh

      - name: Check remote audio source
        run: bash ./scripts/tests/check-remote-audio-source.sh

      - name: Unit tests, lint, and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteX-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/remotex-update.jks"
