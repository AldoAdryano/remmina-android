name: Build Debug APK

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Check repository for secrets
        run: ./scripts/check-secrets.sh

      - name: Check Compose scoped imports
        run: bash ./scripts/tests/check-compose-scope-imports.sh

      - name: Check Kotlin compile regressions
        run: bash ./scripts/tests/check-compile-regressions.sh
      - name: Check app compile regressions
        run: bash ./scripts/tests/check-app-compile-regressions.sh

      - name: Unit tests, lint, and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteX-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
