name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (example v1.0.0-rc1)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REMOTEX_KEYSTORE_PASSWORD: ${{ secrets.REMOTEX_KEYSTORE_PASSWORD }}
      REMOTEX_KEY_ALIAS: ${{ secrets.REMOTEX_KEY_ALIAS }}
      REMOTEX_KEY_PASSWORD: ${{ secrets.REMOTEX_KEY_PASSWORD }}
      REMOTEX_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets
        shell: bash
        env:
          REMOTEX_KEYSTORE_BASE64: ${{ secrets.REMOTEX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$REMOTEX_KEYSTORE_BASE64" ]] || { echo 'REMOTEX_KEYSTORE_BASE64 is missing'; exit 1; }
          [[ -n "$REMOTEX_KEYSTORE_PASSWORD" ]] || { echo 'REMOTEX_KEYSTORE_PASSWORD is missing'; exit 1; }
          [[ -n "$REMOTEX_KEY_ALIAS" ]] || { echo 'REMOTEX_KEY_ALIAS is missing'; exit 1; }
          [[ -n "$REMOTEX_KEY_PASSWORD" ]] || { echo 'REMOTEX_KEY_PASSWORD is missing'; exit 1; }

      - name: Decode release keystore
        shell: bash
        env:
          REMOTEX_KEYSTORE_BASE64: ${{ secrets.REMOTEX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/remotex-release.jks"
          printf '%s' "$REMOTEX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "REMOTEX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Check repository for secrets
        run: ./scripts/check-secrets.sh

      - name: Check Kotlin compile regressions
        run: bash ./scripts/tests/check-compile-regressions.sh
      - name: Check app compile regressions
        run: bash ./scripts/tests/check-app-compile-regressions.sh
      - name: Check MINA Android runtime setup
        run: bash ./scripts/tests/check-mina-android-runtime.sh

      - name: Check SFTP IO dispatch
        run: bash ./scripts/tests/check-sftp-io-dispatch.sh

      - name: Check stable debug signing source
        run: bash ./scripts/tests/check-stable-debug-signing.sh

      - name: Check VNC polish source
        run: bash ./scripts/tests/check-vnc-polish-source.sh

      - name: Check VNC input stability
        run: bash ./scripts/tests/check-vnc-input-stability.sh

      - name: Check remote audio source
        run: bash ./scripts/tests/check-remote-audio-source.sh

      - name: Check VNC performance and audio latency
        run: bash ./scripts/tests/check-vnc-performance.sh

      - name: Check VNC adaptive display quality
        run: |
          bash ./scripts/tests/check-vnc-quality-pure.sh
          bash ./scripts/tests/check-vnc-quality-source.sh

      - name: Check VNC soft keyboard Enter
        run: bash ./scripts/tests/check-vnc-soft-keyboard-enter.sh

      - name: Check VNC Tight video pipeline
        run: bash ./scripts/tests/check-vnc-tight-video.sh

      - name: Check remote audio sync
        run: bash ./scripts/tests/check-remote-audio-sync.sh

      - name: Resolve Android version name
        shell: bash
        run: echo "REMOTEX_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Unit tests, lint, and signed release APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Verify APK signature
        run: ./scripts/verify-release-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/RemoteX-Android-${RELEASE_TAG}.apk"
          (cd release-assets && sha256sum "RemoteX-Android-${RELEASE_TAG}.apk" > RemoteX-Android.sha256)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "RemoteX Android ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/remotex-release.jks"
